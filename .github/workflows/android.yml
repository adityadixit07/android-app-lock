name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AppLock-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AppLock-debug
          path: AppLock-debug.apk
          if-no-files-found: error

  # Separate job so a lint finding never blocks the testable APK; it still fails the run.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # Publishes the latest debug APK as a GitHub pre-release so it can be downloaded
  # straight onto a phone (artifacts require a GitHub login and come zipped).
  publish-debug:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AppLock-debug

      - name: Replace "debug-latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest AppLock-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "App Lock — latest debug build" \
            --notes "Debug build of ${GITHUB_SHA::7} from \`${GITHUB_REF_NAME}\`. Install AppLock-debug.apk on your phone (allow installs from your browser). Signed with the public debug key, so newer builds install over older ones."
