name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testStandardDebugUnitTest --stacktrace

      - name: Assemble debug APKs (standard + full)
        run: ./gradlew assembleStandardDebug assembleFullDebug --stacktrace

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/standard/debug/app-standard-debug.apk AppLock-debug.apk
          cp app/build/outputs/apk/full/debug/app-full-debug.apk AppLock-full-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: AppLock-debug
          path: |
            AppLock-debug.apk
            AppLock-full-debug.apk
          if-no-files-found: error

  # Separate job so a lint finding never blocks the testable APK; it still fails the run.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew lintStandardDebug lintFullDebug --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  # Publishes the latest debug APK as a GitHub pre-release so it can be downloaded
  # straight onto a phone (artifacts require a GitHub login and come zipped).
  publish-debug:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AppLock-debug

      - name: Replace "debug-latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest AppLock-debug.apk AppLock-full-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "App Lock — latest debug build" \
            --notes "Debug build of ${GITHUB_SHA::7} from \`${GITHUB_REF_NAME}\`.

          - **AppLock-debug.apk** (recommended): installs from your phone's browser. Detects apps via Usage Access.
          - **AppLock-full-debug.apk**: adds instant Accessibility detection. Google Play Protect blocks it when installed from a browser in some regions; install with \`adb install -r\` instead.

          Both are signed with the public debug key, so newer builds install over older ones."
